---
# Copy this file outside git or to ansible/vault/uconsole-secrets.yml,
# edit the values, then encrypt it with ansible-vault.
#
#   ansible-vault encrypt ansible/vault/uconsole-secrets.yml
#   ansible-vault decrypt ansible/vault/uconsole-secrets.yml
#
# The encrypted file can be ingested by the prep scripts with:
#
#   ANSIBLE_VAULT_FILE=ansible/vault/uconsole-secrets.yml
#
uconsole_user: uconsole
uconsole_password: change-this-password
